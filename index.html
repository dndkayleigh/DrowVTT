  // ---------- Backend transmit (UPDATED: read response, optional auto-apply) ----------
  async function sendStateToBackend() {
    const url = document.getElementById('apiUrl').value.trim();
    const status = document.getElementById('sendStatus');
    const autoApply = document.getElementById('autoApplyAI').checked;
    const strategy = getSelectedAiStrategy();
    if (strategy?.id === 'group_tactical' && getAiGroupTokenIds().length === 0) {
      status.textContent = 'Create a monster group first with Set Group From Selection.';
      return;
    }
    const userContext = authAdapter.requireAuthenticatedUser();
    if (!authAdapter.canPerform('run_ai', { userContext })) {
      status.textContent = 'Run AI is not permitted for this user.';
      return;
    }
    if (!url) return;

    // ---- Timing markers ----
    const t0 = nowMs();

    // Build payload (recommended: keep it small for speed)
    // If you want to time your larger payload, you can keep your old payload builder,
    // but this smaller one is faster and measures OpenAI turn latency cleanly.
    const payload = {
      aiExport: exportBox.value,
      strategy: strategy?.id || DEFAULT_AI_TURN_STRATEGY_ID,
      model: strategy?.model || 'gpt-5'
    };

    const t1 = nowMs(); // payload built

    let body;
    try {
      body = JSON.stringify(payload);
    } catch (e) {
      status.textContent = "Failed to serialize payload.";
      return;
    }
    const t2 = nowMs(); // serialized

    // Payload size (helps diagnose slowness)
    pushLog(`Payload bytes: ${body.length}`);

    status.textContent = getAiProgressMessage(strategy);

    // Correlate logs between browser + server
    const reqId = (crypto.randomUUID?.() || String(Date.now()));
    const usageEvent = usageTracking.recordTacticsInvocationStart({
      requestId: reqId,
      userId: userContext.userId,
      accountId: userContext.accountId,
      sessionId: null,
      strategyId: strategy?.id || DEFAULT_AI_TURN_STRATEGY_ID,
      model: strategy?.model || 'gpt-5',
      payloadBytes: body.length
    });

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Client-Req-Id': reqId
        },
        body
      });

      const t3 = nowMs(); // response headers received (TTFB-ish)

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`HTTP ${res.status}: ${text}`);
      }

      // Response size (if server provides Content-Length)
      const contentLen = res.headers.get('content-length');
      if (contentLen) pushLog(`Response bytes (header): ${contentLen}`);

      const aiObj = await res.json();
      const t4 = nowMs(); // parsed JSON

      // Put response into Apply box for transparency
      document.getElementById('applyJson').value = JSON.stringify(aiObj, null, 2);
      const t5 = nowMs(); // UI updated

      if (autoApply) {
        applyAiObject(aiObj, { source: 'Backend' });
      }
      const t6 = nowMs(); // applied

      // Backend timing if included
      const serverTiming = aiObj?._timing || null;

      pushLog(
        `Req ${reqId} timing: total=${ms(t6 - t0)} | build=${ms(t1 - t0)} ` +
        `json=${ms(t2 - t1)} net+server=${ms(t3 - t2)} parse=${ms(t4 - t3)} ` +
        `ui=${ms(t5 - t4)} apply=${ms(t6 - t5)}`
      );

      if (serverTiming) {
        pushLog(
          `Backend _timing: total=${serverTiming.total_ms}ms ` +
          `openai=${serverTiming.openai_ms}ms ` +
          `prep=${serverTiming.prep_ms ?? 0}ms parse=${serverTiming.parse_ms ?? 0}ms ` +
          `model=${serverTiming.model ?? "?"}` +
          `${serverTiming.strategy ? ` strategy=${serverTiming.strategy}` : ''}` +
          `${serverTiming.packet_variant ? ` packet=${serverTiming.packet_variant}` : ''}`
        );

        if (serverTiming.tokens) {
          pushLog(
            `Tokens: input=${serverTiming.tokens.input ?? "?"} ` +
            `output=${serverTiming.tokens.output ?? "?"} ` +
            `total=${serverTiming.tokens.total ?? "?"}`
          );
        }
      }

      status.textContent = autoApply
        ? `AI response ✓ (auto) total ${Math.round(t6 - t0)}ms`
        : `AI response ✓ total ${Math.round(t6 - t0)}ms`;

      usageTracking.recordTacticsInvocationResult({
        id: usageEvent.id,
        requestId: reqId,
        status: 'succeeded',
        userId: userContext.userId,
        accountId: userContext.accountId,
        sessionId: null,
        strategyId: strategy?.id || DEFAULT_AI_TURN_STRATEGY_ID,
        model: serverTiming?.model ?? strategy?.model ?? 'gpt-5',
        latencyMs: t6 - t0,
        tokens: serverTiming?.tokens || null
      });

    } catch (err) {
      status.textContent = `Send failed: ${err.message || err}`;
      pushLog(`Req ${reqId} failed: ${err.message || err}`);
      usageTracking.recordTacticsInvocationResult({
        id: usageEvent.id,
        requestId: reqId,
        status: 'failed',
        userId: userContext.userId,
        accountId: userContext.accountId,
        sessionId: null,
        strategyId: strategy?.id || DEFAULT_AI_TURN_STRATEGY_ID,
        model: strategy?.model || 'gpt-5',
        latencyMs: nowMs() - t0,
        error: err.message || err
      });
    }
  }

  // ---------- Mouse / Keyboard ----------
  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('contextmenu', (e) => {
    const m = getMousePos(e);
    const world = screenToWorld(m.x, m.y);
    const hit = tokenHitTest(world.x, world.y);
    const menuTarget = computeCanvasContextMenuTarget({
      hit,
      clientX: e.clientX,
      clientY: e.clientY
    });
    if (!menuTarget.openMenu) return;
    e.preventDefault();
    setCurrentTurnTokenId(menuTarget.tokenId);
    openTokenContextMenu(menuTarget.tokenId, menuTarget.clientX, menuTarget.clientY);
  });

  canvas.addEventListener('mousedown', (e) => {
    if (!tokenContextMenu.hidden) hideTokenContextMenu();
    const m = getMousePos(e);
    state.lastMouse = m;

    const world = screenToWorld(m.x, m.y);
    const hit = tokenHitTest(world.x, world.y);
    const mouseIntent = computeCanvasMouseDownIntent({
      button: e.button,
      hit,
      metaKey: e.metaKey,
      ctrlKey: e.ctrlKey,
      isAiControllableToken: !!hit && isAiControllableToken(hit, state.aiControls),
      spaceDown: state.spaceDown,
      dragMode: state.dragMode,
      calibrationActive: calibrationState.active
    });

    if (mouseIntent.type === 'calibration-click') {
      handleCalibrationClick(world);
      return;
    }

    if (mouseIntent.type === 'toggle-selection') {
      toggleTokenSelection(mouseIntent.tokenId);
      draw();
      renderTokenList();
      syncTokenSelectionUi();
      refreshExport();
      return;
    }

    if (mouseIntent.type === 'drag-token') {
      setCurrentTurnTokenId(mouseIntent.tokenId);
      state.draggingToken = hit;
      state.dragOffset.x = world.x - hit.x;
      state.dragOffset.y = world.y - hit.y;
      state.dragOriginCell = gridCoords(hit);
      return;
    }

    if (mouseIntent.type === 'drag-map') {
      state.draggingMap = true;
      return;
    }

    state.draggingPan = true;
    canvas.classList.add('dragging');
  });

  window.addEventListener('mouseup', () => {
    if (state.draggingArtPreview) {
      state.draggingArtPreview = false;
      artPreviewShell.classList.remove('dragging');
    }
    if (state.draggingToken) {
      const t = state.draggingToken;
      const targetCell = gridCoords(t);
      const result = moveTokenToCell(t, targetCell, {
        source: 'Drag',
        fromCell: state.dragOriginCell || gridCoords(t),
        manualOverride: true
      });
      const dragOutcome = resolveDragComplete({
        result,
        token: t,
        targetCell,
        fallbackCell: state.dragOriginCell || gridCoords(t)
      });
      clearAiPaths();
      if (!dragOutcome.ok) {
        const snapped = centerFromGridCell(dragOutcome.resetToCell.x, dragOutcome.resetToCell.y, t.sizeCells);
        t.x = snapped.x;
        t.y = snapped.y;
        pushLog(dragOutcome.logMessage);
      } else {
        pushLog(dragOutcome.logMessage);
      }
      state.draggingToken = null;
      state.dragOriginCell = null;
      draw(); renderTokenList(); refreshExport(); loadCurrentTurnTokenToEditor();
    }
    if (state.draggingMap) { state.draggingMap = false; draw(); }
    if (state.draggingPan) { state.draggingPan = false; canvas.classList.remove('dragging'); draw(); }
  });

  window.addEventListener('mousemove', (e) => {
    const m = getMousePos(e);
    const dx = m.x - state.lastMouse.x;
    const dy = m.y - state.lastMouse.y;
    state.lastMouse = m;
    calibrationCursor = screenToWorld(m.x, m.y);

    if (state.draggingArtPreview) {
      const draft = state.tokenArtEditor?.draft;
      const image = draft ? ensureTokenArtImage(draft) : null;
      if (draft && image) {
        const shellRect = artPreviewShell.getBoundingClientRect();
        const drag = state.draggingArtPreview;
        const placement = buildTokenArtImagePlacement(image, artPreviewCanvas.width * 0.8, draft);
        const overflowX = Math.max(1, placement.drawW - artPreviewCanvas.width * 0.8);
        const overflowY = Math.max(1, placement.drawH - artPreviewCanvas.height * 0.8);
        const nextPanX = drag.startPanX + ((e.clientX - drag.startX) / shellRect.width) * (2 * (artPreviewCanvas.width * 0.8) / overflowX);
        const nextPanY = drag.startPanY + ((e.clientY - drag.startY) / shellRect.height) * (2 * (artPreviewCanvas.height * 0.8) / overflowY);
        draft.panX = clamp(nextPanX, -1, 1);
        draft.panY = clamp(nextPanY, -1, 1);
        updateTokenArtInputsFromDraft();
        renderArtEditorPreview();
      }
      return;
    }

    if (state.draggingToken) {
      const world = screenToWorld(m.x, m.y);
      const t = state.draggingToken;
      t.x = world.x - state.dragOffset.x;
      t.y = world.y - state.dragOffset.y;
      const s = snapWorldPoint(t.x, t.y, t.sizeCells);
      t.x = s.x; t.y = s.y;
      draw(); renderTokenList(); refreshExport();
      return;
    }

    if (state.draggingMap) {
      state.map.offX += dx / state.view.zoom;
      state.map.offY += dy / state.view.zoom;
      draw();
      return;
    }

    if (state.draggingPan) {
      state.view.panX += dx;
      state.view.panY += dy;
      draw();
    }
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const m = getMousePos(e);
    const before = screenToWorld(m.x, m.y);
    const zoomFactor = (e.deltaY < 0) ? 1.08 : 1 / 1.08;
    state.view.zoom = clamp(state.view.zoom * zoomFactor, 0.15, 6);
    const after = screenToWorld(m.x, m.y);
    state.view.panX += (after.x - before.x) * state.view.zoom;
    state.view.panY += (after.y - before.y) * state.view.zoom;
    draw();
  }, { passive: false });

  window.addEventListener('keydown', (e) => { if (e.code === 'Space') state.spaceDown = true; });
  window.addEventListener('keyup',   (e) => { if (e.code === 'Space') state.spaceDown = false; });
  window.addEventListener('mousedown', (e) => {
    if (!tokenContextMenu.hidden && !tokenContextMenu.contains(e.target)) hideTokenContextMenu();
    if (!tokenArtModal.hidden && e.target === tokenArtModal) closeTokenArtEditor();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (calibrationState.active) {
        stopCalibration();
        return;
      }
      if (state.sidebarDrawerOpen) {
        closeSidebarDrawer();
      }
      if (!tokenContextMenu.hidden) hideTokenContextMenu();
      if (!tokenArtModal.hidden) closeTokenArtEditor();
    }
  });

  // ---------- Init ----------
  setTurnTab('stats');
  setDrawerTab(null);
  syncSidebarDrawer();
  syncCalibrationControls();
  document.getElementById('gridSize').dispatchEvent(new Event('input'));
  document.getElementById('snapMode').dispatchEvent(new Event('change'));
  syncBoardStatusVisibility();
  aiStrategySelect.value = DEFAULT_AI_TURN_STRATEGY_ID;
  syncAiStrategyUi();
  syncTokenSelectionUi();
  sessionSync.connect('local-session', authAdapter.getCurrentUserContext());

  // Seed tokens
  function seed() {
    addToken({ name: "Aria", type: "PC", sizeCells: 1, color: "#5aa9ff", ac: 15, hp: "18/18", speed: 30, notes: "", statblock: "" });
    addToken({
      name: "Goblin A", type: "Monster", sizeCells: 1, color: "#ff5a7a", ac: 15, hp: "7/7", speed: 30, notes: "",
      statblock: "Goblin (5e)\n- Speed 30 ft\n- Actions:\n  - Scimitar: +4 to hit, 5 ft, 1d6+2 slashing\n  - Shortbow: +4 to hit, range 80/320, 1d6+2 piercing\n- Bonus Action: Nimble Escape (Disengage or Hide)"
    });
  }
  seed();

  // After seed, pick first token as current
  setCurrentTurnTokenId(state.tokens[0]?.id ?? null);

  // Initial export + render
  refreshExport();
  renderTokenList();
  syncTokenSelectionUi();
  loadCurrentTurnTokenToEditor();
  syncSaveSlotsUiFromStorage();
  setAutosaveEnabled(boardPersistence.getAutosaveEnabled());
  syncAutosaveUiFromStorage();
  updateCalibrationNote();

  setTimeout(resizeCanvasToCSS, 0);

  window.__VTT_DEBUG__ = {
    getAiOverlay: () => JSON.parse(JSON.stringify(state.aiOverlay)),
    getAiTurnPacket: () => buildAiTurnPacket(),
    getAiTurnPacketFull: () => buildAiTurnPacketFull(),
    getBoardSnapshot: () => buildSerializableBoardSnapshot(),
    importBoardSnapshotText: async (text) => await hydrateBoardState(parseBoardSnapshotText(text)),
    getAuthContext: () => authAdapter.getCurrentUserContext(),
    getAutosaves: () => loadAutosaveHistoryFromStorage().map((entry) => ({ id: entry.id, savedAt: entry.savedAt })),
    getAutosaveSnapshot: async (entryId) => await boardPersistence.loadAutosaveSnapshot(entryId),
    getSaveSlots: () => loadSaveSlotsFromStorage().map((slot) => ({ id: slot.id, name: slot.name, savedAt: slot.savedAt })),
    getSaveSlotSnapshot: async (slotId) => await boardPersistence.loadSaveSlotSnapshot(slotId),
    getSessionEvents: () => sessionSync.getPublishedEvents(),
    getUsageEvents: () => usageTracking.getUsageEvents(),
    getTokenInteractionPoint: (tokenId) => {
      const token = state.tokens.find((entry) => entry.id === tokenId);
      if (!token) return null;
      const renderPoint = getTokenRenderWorldPoint(token);
      return worldToScreen(renderPoint.x, renderPoint.y);
    },
    getTokenRenderPoint: (tokenId) => {
      const token = state.tokens.find((entry) => entry.id === tokenId);
      if (!token) return null;
      const renderPoint = getTokenRenderWorldPoint(token);
      return worldToScreen(renderPoint.x, renderPoint.y);
    },
    getTokens: () => state.tokens.map((token) => ({
      id: token.id,
      name: token.name,
      art: token.art ? {
        src: token.art.src,
        scale: token.art.scale,
        panX: token.art.panX,
        panY: token.art.panY,
        fileName: token.art.fileName
      } : null
    }))
  };
})();
</script>
</body>
</html>
