id: long_barrier_ranged_pressure
title: Long barrier ranged pressure
category: ranged cover skirmish
description: |
  A long blocking edge separates the monsters from Aria. The correct behavior is
  for the Orc to route around the barrier into a legal ranged javelin lane,
  without trying to occupy Goblin A's firing lane.

controllers:
  - scripted_baseline
  - utility_baseline

battlefield:
  width: 12
  height: 12
  gridSize: 64
  blockingEdges:
    - orientation: v
      x: 6
      y: 1
      length: 10
      blocksMovement: true
      blocksLineOfSight: true

activeActor: orc

actors:
  - id: orc
    name: Orc
    side: monsters
    position: [4, 6]
    speed: 30
    attacks:
      - name: Greataxe
        kind: melee
        rangeFt: 5
        expectedDamage: 9
      - name: Javelin
        kind: ranged
        rangeFt: 30
        expectedDamage: 6
  - id: goblin_a
    name: Goblin A
    side: monsters
    position: [7, 0]
    speed: 30
    attacks:
      - name: Shortbow
        kind: ranged
        rangeFt: 80
        expectedDamage: 5
  - id: aria
    name: Aria
    side: heroes
    position: [8, 0]
    speed: 30
    attacks: []

expected:
  must:
    - actionType: attack
    - attackName: Javelin
    - attackKind: ranged
    - lineOfSight: true
    - moveDoesNotCrossBlocking: true
    - noOccupiedDestination: true
  mustNot:
    - actionType: dash
    - moveTo: [7, 0]
