id: sanctuary_of_the_magi_2026_05_03
title: The Ossuary Gate Rite
category: custom
benchmark_status: pressure_test
description: |
  name: "The Ossuary Gate Rite"
  map: "Sanctuary of the Magi"
  map_source:
    creator: "Dyson Logos"
    collection_url: "https://dysonlogos.blog/maps/commercial-maps/"
    image_url: "https://dysonlogos.blog/wp-content/uploads/2020/11/sanctuary-of-the-magi.png"
    attribution: "Map by Dyson Logos. Used with attribution according to Dyson Logos commercial-use map terms."
  
  encounter_purpose: >
    This higher-CR mixed-role benchmark tests whether the tactical controller can manage
    a protected boss caster, a defensive screen of 1x1 bodyguards, disciplined soldiers,
    melee disrupters, held ambushers, and a mobile striker. The encounter should preserve
    the ritual-defense structure instead of flattening into every monster dogpiling the
    same target.
  
  setup: >
    The player characters enter the Sanctuary of the Magi while a Mage attempts to stabilize
    or open an arcane gate at the central or rear ritual area. The Mage is the protected
    boss caster and ritual actor. The monsters should delay, divide, and punish the party
    while preventing the player characters from reaching the Mage.
  
  monsters:
    - name: "Mage"
      count: 1
      tactical:
        role: "boss_caster"
        mapped_core_role: "support_caster"
        protected_asset: true
        objective_role: "ritual_actor"
        role_notes: >
          Protected boss caster. Avoid melee, preserve distance, use spells, and retreat
          toward secondary cover if the defensive screen collapses.
  
    - name: "Wraith"
      count: 1
      tactical:
        role: "mobile_striker"
        mapped_core_role: "ambusher_bruiser"
        role_notes: >
          Mobile terror and backline assassin. Threaten vulnerable or isolated characters.
          Do not hold the front line like a soldier.
  
    - name: "Thug"
      count: 2
      tactical:
        role: "brute_blocker"
        mapped_core_role: "disciplined_blocker"
        role_notes: >
          1x1 bodyguard replacement for ogres. Hold nearby approaches, protect the Mage,
          and prevent player characters from breaking into the ritual area.
  
    - name: "Veteran"
      count: 2
      tactical:
        role: "disciplined_soldier"
        mapped_core_role: "disciplined_blocker"
        role_notes: >
          Trained guards. Hold assigned defensive posts, use ranged attacks at distance,
          and switch to melee when the line is breached.
  
    - name: "Ghast"
      count: 2
      tactical:
        role: "melee_disrupter"
        mapped_core_role: "ambusher_bruiser"
        role_notes: >
          Aggressive melee disrupters. Use side lanes, punish isolated or overextended
          characters, and exploit openings near the defensive screen.
  
    - name: "Gargoyle"
      count: 2
      tactical:
        role: "held_ambusher"
        mapped_core_role: "ambusher_bruiser"
        role_notes: >
          Statue-like ambushers or interceptors. Begin in side alcoves, high-looking
          positions, or defensive perches. Do not immediately abandon ambush posture unless
          a vulnerable or overextended target appears.
  
  starting_positions: >
    Place the Mage in the central or rear ritual area with partial cover and a fallback
    route if available. Place the two Thugs near the closest approaches to the Mage as
    bodyguards. Place the Veterans on the flanks or near partial cover where they can
    defend approaches. Place the Ghasts in side chambers or broken alcoves where they can
    threaten overextended player characters. Place the Gargoyles in statue-like or elevated
    side positions. Place the Wraith near a side crypt, rear alcove, or ritual-adjacent
    chamber where it can threaten the backline without acting as a static blocker.
  
  doctrines:
    active_supported:
      - name: "protect_asset"
        protected_asset: "Mage"
        notes: >
          If the current controller only supports protect_caster, treat the Mage as the
          protected caster/asset.
  
    desired_text_only:
      - name: "complete_ritual"
        actor: "Mage"
        status: "unsupported_metadata_only"
        notes: >
          The Mage is attempting to stabilize or open the ossuary gate. This is currently
          ideal-behavior metadata unless objective mechanics exist.
  
      - name: "hold_defensive_line"
        actors:
          - "Thug"
          - "Veteran"
        status: "unsupported_metadata_only"
        notes: >
          Thugs and Veterans should preserve the defensive screen around the Mage.
  
      - name: "punish_overextension"
        actors:
          - "Wraith"
          - "Ghast"
          - "Gargoyle"
        status: "unsupported_metadata_only"
        notes: >
          Mobile and ambush monsters should punish isolated or overextended player
          characters rather than acting as generic soldiers.
  
  ideal_behavior: >
    The Mage should act as the protected boss caster and ritual actor. It should avoid
    melee, preserve distance, use spells to control or punish dangerous player characters,
    and retreat toward secondary cover if the front line collapses. If ritual objective
    mechanics are available, the Mage should prefer preserving the ritual unless a spell
    is needed to prevent immediate loss of the position.
  
    The Thugs should act as 1x1 heavy bodyguards. They replace the original ogres because
    the map does not have enough space for Large blockers. They should occupy nearby lanes,
    prevent player characters from reaching the Mage, and avoid chasing targets so far
    that they open a path through the defensive screen.
  
    The Veterans should act as disciplined soldiers. They should hold assigned defensive
    posts, use ranged attacks when the party is at distance, and switch to melee when the
    defensive line is breached. They should help preserve the screen around the Mage rather
    than skirmishing randomly across the map.
  
    The Ghasts should act as aggressive melee disrupters. They should attack player
    characters who become isolated, flank through side chambers, or threaten the Mage.
    They should not replace the Thugs as static blockers; their job is to punish
    overextension and exploit openings.
  
    The Gargoyles should act as held ambushers or interceptors. They should begin in
    statue-like, defensive, side-alcove, or high-looking positions and should not
    immediately abandon those positions unless they can intercept a vulnerable or
    overextended player character.
  
    The Wraith should act as a mobile terror and backline assassin. It should not hold
    the front line like a soldier. It should threaten vulnerable characters, punish isolated
    targets, and pressure the party's spellcasters or ranged attackers. If no vulnerable
    target is available, it should maintain a threatening position near the ritual area
    rather than making low-value attacks.
  
  success_criteria: >
    A strong controller should keep the Mage protected, preserve the central ritual
    structure, use Thugs and Veterans to hold approaches, use Ghasts and Gargoyles to
    punish overextension, and use the Wraith as a mobile high-threat striker. The monsters
    should not all dogpile the same target unless that target is clearly the central
    tactical threat.
  
  failure_modes: >
    A weak controller will move the Mage into melee, make Thugs behave like ranged
    skirmishers, have Veterans abandon disciplined posts, use the Wraith as a static
    blocker, have Gargoyles abandon ambush positions immediately, or dogpile one target
    while ignoring the ritual structure.
  
  expectations:
    - "noOccupiedDestination"
    - "moveDoesNotCrossBlocking"
    - "mageDoesNotPreferMeleeWhenSpellsAvailable"
    - "bodyguardsDoNotAbandonMageApproach"
    - "ambushersDoNotImmediatelyBreakPostureWithoutTrigger"
  
  notes: >
    This fixture intentionally keeps unsupported doctrines as metadata-only. Do not add
    complete_ritual, hold_defensive_line, punish_overextension, flight, verticality, or
    objective mechanics just to make this encounter pass. The benchmark should first reveal
    whether current role metadata, protected-asset logic, candidate generation, and scoring
    are sufficient.

