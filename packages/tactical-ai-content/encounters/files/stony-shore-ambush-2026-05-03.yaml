  attribution: "Map by Dyson Logos. Used with attribution according to Dyson Logos commercial-use map terms."

party_assumption:
  level: 8
  size: 4

benchmark_status: new_pressure_test

encounter_purpose: |
  Challenge benchmark for four level-8 player characters. This encounter tests mobile
  Large boss behavior, binary blocking around water and cavern geometry, brute chokepoint
  blockers, skirmisher harassment, ambush posture, and large-token pathing without adding
  new rules or tactical scoring logic.

map_interpretation: |
  Use only binary blocking and passable cells. Treat solid cavern walls, cliff edges, and
  deep underground river or water cells as blocking unless specifically marked as a bridge,
  ledge, ford, platform, or walkable cave floor. Do not use difficult terrain for this benchmark.

monsters:
  - name: Young Black Dragon
    count: 1
  - name: Troll
    count: 2
  - name: Lizardfolk
    count: 4
  - name: Giant Crocodile
    count: 1

ideal_behavior: |
  The Young Black Dragon is a mobile boss controller. It should break the party formation,
  threaten clustered or exposed characters, and use open cavern space without assuming
  unsupported flight, swim movement, or breath weapon area targeting.

  Trolls are brute chokepoint blockers. They should hold bridge, cavern, and approach
  lanes that protect the dragon's space and force the party to commit into bad positions.
  Regeneration-aware behavior is intentionally unsupported metadata for this benchmark.

  Lizardfolk are skirmishers. They should harass from side ledges, side caves, and long
  javelin lanes, then avoid congestion around the trolls and dragon.

  The Giant Crocodile is a grappler ambusher. It should punish water-edge or isolated
  movement from a passable pocket near blocked water. Grapple, drag, and swim behavior
  are unsupported metadata and should be diagnosed rather than tuned in this patch.

known_unsupported_features_to_watch:
  - breath weapon area targeting
  - flight or swim movement
  - grapple/drag behavior for the Giant Crocodile
  - regeneration-aware Troll behavior
  - hazard-aware water positioning
  - large-token pathing around narrow cave geometry

expectations:
  - noOccupiedDestination
  - moveDoesNotCrossBlocking

controllers:
  - supervisor_scripted_single
  - supervisor_scripted_group
  - utility_baseline
  - utility_baseline_group

round: 1
activeActor: young_black_dragon

activationGroups:
  - id: stony_shore_monsters
    actorIds: [young_black_dragon, troll_a, troll_b, lizardfolk_a, lizardfolk_b, lizardfolk_c, lizardfolk_d, giant_crocodile]
    activationMode: coordinated_sequential

