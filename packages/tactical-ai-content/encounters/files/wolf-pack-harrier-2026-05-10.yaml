id: wolf_pack_harrier_2026_05_10
title: Wolf Pack Harrier - 2026-05-10
category: custom
description: |
  name: "Wolf Pack Harrier"

  encounter_purpose: >
    Animal/pack benchmark fixture for melee-harrier behavior testing. This
    fixture should confirm that wolves pressure isolated or wounded prey, use
    local pack convergence, and avoid disciplined squad doctrine.

  setup: >
    Four wolves are pressuring a small trail bend with one light blocker wall.
    Three heroes are moving through the area. One hero is slightly isolated and
    wounded, one is closer but screened by the choke, and one remains in a
    supporting position. The fixture supports isolated-prey bias, local pack
    convergence, and moderate self-preserving risk handling.

  ideal_behavior: >
    These wolves should behave as animals rather than soldiers: prefer
    isolated or weak prey, converge locally without disciplined doctrine, and
    care about obvious danger more than zombies do.

controllers:
  - supervisor_scripted_group
  - supervisor_scripted_single
  - utility_baseline_group

round: 1
activeActor: wolf_a

activationGroups:
  - id: wolf_pack
    actorIds: [wolf_a, wolf_b, wolf_c, wolf_d]
    activationMode: coordinated_sequential

battlefield:
  width: 12
  height: 8
  gridSize: 64
  blockingEdges:
    - orientation: v
      x: 5
      y: 0
      length: 2
      blocksMovement: true
      blocksLineOfSight: true
    - orientation: v
      x: 5
      y: 3
      length: 5
      blocksMovement: true
      blocksLineOfSight: true

actors:
  - id: wolf_a
    name: Wolf A
    side: monsters
    position: [2, 2]
    ac: 13
    hp: "11/11"
    speed: 40
    tactical:
      role: skirmisher
      mapped_core_role: skirmisher
      objective_role: harry_isolated_prey
      role_notes: "Fast melee beast. This skirmisher role is intentionally expressed through animal/pack melee harassment instead of soldier-like doctrine."
    behavior:
      cognition: animal
      drive: isolate_weak_prey
      riskTolerance: self_preserving
      coordination: pack
