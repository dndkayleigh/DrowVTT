id: sanctuary_of_the_magi_2026_04_30
title: The Ossuary Gate Rite
category: mixed-role protected caster benchmark
map:
  title: Sanctuary of the Magi
  creator: Dyson Logos
  attribution: "Sanctuary of the Magi by Dyson Logos"
  source_url: "https://dysonlogos.blog/maps/commercial-maps/"
  image_source_url: "https://dysonlogos.blog/wp-content/uploads/2020/11/sanctuary-of-the-magi.png"
  local_image: false
description: |
  encounter_name: "The Ossuary Gate Rite"
  map: "Sanctuary of the Magi"
  map_attribution: "Sanctuary of the Magi by Dyson Logos"
  map_source_url: "https://dysonlogos.blog/maps/commercial-maps/"
  map_image_source_url: "https://dysonlogos.blog/wp-content/uploads/2020/11/sanctuary-of-the-magi.png"

  encounter_purpose:
    This higher-CR mixed-role benchmark tests whether the portable tactical
    controller can defend a protected boss caster and ritual structure without
    turning every monster into a focus-fire skirmisher. The map image is not
    stored locally in this fixture; this file preserves source attribution and
    references the public source URLs only.

  monster_roster:
    - 1 Mage
    - 1 Wraith
    - 2 Ogres
    - 2 Ghasts
    - 2 Gargoyles
    - 2 Veterans

  protected_asset:
    actor: "Mage"
    active_doctrine: "protect_caster"
    current_inference_note: >
      The Mage includes support/defensive spell metadata so current supervisor
      inference can identify a support_caster and activate protect_caster.

  desired_doctrines:
    primary_text_only: "complete_ritual / preserve_objective"
    secondary_active_if_inferred: "protect_asset / protect_caster"
    tertiary_text_only: "hold_defensive_line"
    quaternary_text_only: "punish_overextension"

  unsupported_doctrine_gaps_future_work:
    - "complete_ritual and preserve_objective are text-only in this fixture."
    - "hold_defensive_line is described but not forced as a multi-doctrine objective."
    - "punish_overextension is described but not implemented as a doctrine."
    - "Gargoyle elevation/statue posture is text-only until verticality exists."

  ideal_behavior:
    mage:
      role: "protected boss caster / ritual actor / controller-artillery"
      behavior: >
        The Mage is the protected asset and ritual actor. It should avoid melee,
        preserve distance, use spells to control or punish dangerous player
        characters, and retreat toward secondary cover if the front line
        collapses. If a ritual objective is active in a future system, it should
        prefer preserving the rite unless immediate defense is required.

    ogres:
      role: "heavy blockers / bodyguards / lane holders"
      behavior: >
        Ogres should occupy the main approaches into the central ritual chamber,
        prevent player characters from reaching the Mage, and avoid chasing
        distant targets so far that they open a path through the defensive line.

    veterans:
      role: "disciplined soldiers / ranged-to-melee guards"
      behavior: >
        Veterans should hold assigned defensive posts, use ranged attacks when
        the party is at distance, and switch to melee when the line is breached.
        They should preserve the screen around the Mage rather than skirmishing
        randomly across the map.

    ghasts:
      role: "melee disrupters / punish overextension"
      behavior: >
        Ghasts should attack player characters who become isolated, flank through
        side chambers, or threaten the Mage. They should not replace the Ogres as
        static blockers; their job is to punish overextension and exploit
        openings.

    gargoyles:
      role: "elevated or statue-like ambushers / interceptors"
      behavior: >
        Gargoyles should begin in defensive or side-alcove positions and should
        not immediately abandon those positions unless they can intercept a
        vulnerable or overextended player character. Elevation is text-only in
        this fixture because the current tactical model has no verticality
        mechanics.

    wraith:
      role: "mobile terror / backline assassin / high-threat striker"
      behavior: >
        The Wraith should not hold the front line like a soldier. It should
        threaten vulnerable characters, punish isolated targets, and pressure
        spellcasters or ranged attackers. If no vulnerable target is available,
        it should maintain a threatening ritual-adjacent position rather than
        making low-value attacks.

  success_criteria_text_only:
    - "Keep the Mage protected."
    - "Preserve the central ritual structure."
    - "Use Ogres and Veterans to hold approaches."
    - "Use Ghasts and Gargoyles to punish overextension."
    - "Use the Wraith as a mobile high-threat striker."
    - "Avoid sending the Mage into melee."
    - "Avoid sending Ogres chasing distant skirmishers."
    - "Avoid turning every monster into a ranged focus-fire unit."

controllers:
  - supervisor_scripted_single
  - utility_baseline

