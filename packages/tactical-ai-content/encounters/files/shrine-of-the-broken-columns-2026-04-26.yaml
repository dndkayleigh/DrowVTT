id: shrine_of_the_broken_columns_2026_04_26
title: Shrine of the Broken Columns
category: ranged cover skirmish
description: |
  Four PCs enter a ruined shrine from the south. The playable tactical interior
  is a 13x13 grid; the visual outer wall from the source sketch is intentionally
  excluded from the legal battlefield. The far side is defended by a mixed group
  of three Guards, two Scouts, and two Acolytes. Broken columns, toppled statues,
  rubble, and a central altar create lanes that should matter tactically.

  This fixture is intended for deterministic tactics work only for now:
  scripted, utility, and supervisor families in both current-token and selected
  group activation scope. Do not use LLM-based approaches for this fixture until
  explicitly re-enabled.

  Correct broad behavior:
  - Guards should act as front-line defenders and hold or advance into useful
    lane-control positions.
  - Scouts should preserve range, seek legal firing lanes around blockers, and
    avoid unnecessary melee contact.
  - Acolytes should remain protected behind Guards or blocker-adjacent cover and
    should avoid front-line exposure.
  - The group should use more than one lane when useful instead of clustering
    all enemies into the same central gap.

  Hard failures:
  - Any path crossing a blocked column, statue, rubble, wall, or altar edge.
  - Any actor ending on an illegal occupied destination.
  - Any ranged attack through a line-of-sight blocking edge.
  - Any Scout walking into melee when a legal ranged line exists.
  - Any Acolyte advancing ahead of the Guards without tactical pressure.

controllers:
  - scripted_baseline
  - scripted_baseline_group
  - utility_baseline
  - utility_baseline_group
  - supervisor_scripted_single
  - supervisor_scripted_group

