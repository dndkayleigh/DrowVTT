id: zombie_doorway_press_2026_05_10
title: Zombie Doorway Press - 2026-05-10
category: custom
description: |
  name: "Zombie Doorway Press"

  encounter_purpose: >
    Low-cognition benchmark fixture for mindless behavior testing. This
    fixture should confirm that zombies press nearest reachable prey, tolerate
    doorway congestion, and avoid trained-squad style tactics.

  setup: >
    Four zombies are pressing toward a narrow doorway from the west side of a
    small crypt. Three heroes are on the east side of the doorway. One hero is
    closest to the choke, one farther hero is wounded and tactically tempting,
    and one backline hero supports from behind. The fixture supports
    nearest-target bias, doorway clogging, and low tactical sophistication.

  ideal_behavior: >
    These zombies should act mindlessly: press the nearest reachable living
    prey, accept congestion, avoid coordinated focus fire, and show high
    target stickiness.

controllers:
  - supervisor_scripted_group
  - supervisor_scripted_single
  - utility_baseline_group

round: 1
activeActor: zombie_a

activationGroups:
  - id: zombie_press
    actorIds: [zombie_a, zombie_b, zombie_c, zombie_d]
    activationMode: coordinated_sequential

battlefield:
  width: 10
  height: 8
  gridSize: 64
  blockingEdges:
    - orientation: v
      x: 4
      y: 0
      length: 3
      blocksMovement: true
      blocksLineOfSight: true
    - orientation: v
      x: 4
      y: 4
      length: 4
      blocksMovement: true
      blocksLineOfSight: true

actors:
  - id: zombie_a
    name: Zombie A
    side: monsters
    position: [2, 3]
    ac: 8
    hp: "22/22"
    speed: 20
    tactical:
      role: blocker
      function: body_pressure
      intent:
        - press_nearest
        - clog_doorway
      posture: aggressive
      tags:
        - undead
        - melee
        - body_pressure
        - swarm_member
      objectiveRole: press_doorway
      roleNotes: "Mindless undead pressure body. Uses simple blocking/body-pressure behavior rather than trained squad doctrine."
    behavior:
      cognition: mindless
      drive: nearest_living_prey
      riskTolerance: fearless
      coordination: none
      planningHorizon: immediate
      targetStickiness: high
